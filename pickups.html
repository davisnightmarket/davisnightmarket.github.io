<!DOCTYPE html>
<html>

<head>
    <title>Pickups</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        #main {
            max-width: 400px;
            margin: auto;
        }

        #days {
            display: flex;
            flex-direction: row;
        }

        #days label {
            flex: 1;
        }

        #days label div {
            padding: 5px;
            margin: 1px;
            color: white;
            background-color: gray;
            display: flex;
            text-align: center;
        }

        #days label div span {
            margin: auto;
        }

        #days input[type="radio"]:checked ~ * {
            background-color: lightblue;
        }

        input[type=radio] {
            display: none;
        }

        #days :first-child div {
            border-radius: 10px 0px 0px 10px;
        }

        #days :last-child div {
            border-radius: 0px 10px 10px 0px;
        }

        #pickups>div:nth-of-type(even) {
            background-color: antiquewhite;
        }

        .pickup {
            display: flex;
            flex-direction: row;
            padding: 8px;
            margin: 1px 0px;
            
            justify-content: baseline;
            align-items:baseline;
        }

        .org {
            font-weight: bold;
            padding-right: 10px;
            vertical-align: text-bottom;
        }

        .time {
            flex: 1;
        }

        .button {
            padding: 5px 15px;
            color: black;
            background-color: #87cefa;
            text-align: center;
            border-radius: 20px;
        }

        .button.gray {
            background: rgb(240, 240, 240);
            color: black;
        }

        .button.red {
            background-color: #D14B49;
            color: black;
        }

    </style>
</head>

<body>
    <div id="main">
        <div id="days">
            <label><input type="radio" name="day" checked><div><span>Mon</span></div></label>
            <label><input type="radio" name="day"><div><span>Tue</span></div></label>
            <label><input type="radio" name="day"><div><span>Wed</span></div></label>
            <label><input type="radio" name="day"><div><span>Thu</span></div></label>
            <label><input type="radio" name="day"><div><span>Fri</span></div></label>
        </div>
        <div id="pickups">
        </div>
    </div>

    <script type="text/javascript">
        async function main() {
            const rows = await fetch("./pickups.json").then((res) => res.json())
            const pickups = rows
                .filter(row => row.length > 0)
                .map(row => ({
                    day: row[0],
                    time: row[1],
                    org: row[2],
                    volunteers: [row[3], row[4], row[5]].filter((name) => name != "" && name != "NEEDED"),
                    note: row[7]
                }))

            // select inital day and add callbacks for when it changes
            selectDate("Mon".toLowerCase())
            document.querySelectorAll("#days label").forEach(label => {
                label.onchange = () => selectDate(label.querySelector("span").innerText.toLowerCase())
            })

            function selectDate(day) {
                document.getElementById("pickups").replaceChildren(
                    ...pickups
                        .filter(pickup => pickup.day.startsWith(day))
                        .map(createPickupEl)
                )
            }

            function el(tag, ...children) {
                const [name, ...classes] = tag.split(".")
                const el = document.createElement(name)
                el.classList = classes.join(" ")
                el.replaceChildren(...children)
                return el 
            }


            function getNickname(name) {
                const nicknames = {
                    "Davis Food Co-op": "Co-op",
                    "Davis Farmer's Market": "Farmer's Market",
                    "Sophia's Thai Kitchen": "Sophia's",
                    "Insomnia Cookies": "Insomnia",
                    "Upper Crust Baking Co": "Upper Crust",
                    "Davis Community Meals": "DCM",
                }

                if (name in nicknames) {
                    return nicknames[name]
                } else {
                    return name
                }
            }


            function needsVolenteer(pickup) {
                return pickup.volunteers.length === 0
            }

            function amISignedUp(pickup) {
                const user = "Felix"

                return pickup.volunteers.includes(user)
            }

            function createPickupEl(pickup) {
                const pickupEl = el("div.pickup",
                    el("span.org", getNickname(pickup.org)),
                    el("span.time", pickup.time),
                    needsVolenteer(pickup) ? el("div.button.red", "NEEDED") :
                    amISignedUp(pickup) ? el("div.button", "It's you!") :
                        el("div.button.gray", "Shadow"),
                )

                pickupEl.onclick = () => alert(pickup.note)

                return pickupEl
            }
        }

        main()
    </script>
</body>

</html>
