<!DOCTYPE html>
<html>
    <head>
        <title>Sheets API Quickstart</title>
        <meta charset="utf-8" />

        <style>
            * {
                font-size: 20px;
            }

            body {
				margin: 0px;
			}

            #modal_content {
                background-color: white;
                width: 600px;
                padding: 20px;
                border-radius: 20px;
                margin: auto;
                margin-top: 50px;
            }

            #modal_backdrop {
                display: none;
                background-color: rgba(0, 0, 0, 0.25);
                position:fixed;
                top: 0px;
                left: 0px;
                width: 100vw;
                height: 100vh;
            }

            .bold {
                font-weight: bold;
            }

            .p {
                line-height: 1.5em;
            }

            .pickup {
                box-sizing: content-box;
                background-color: lightgreen;
                border-radius: 5px;
                padding: 5px;
                border: none;
                text-align: left;
                margin-top: 5px;
            }

            .urgent {
                background-color: rgb(252, 81, 81); 
            }

            .subtitle button {
                border: none;
                background: none;
            }

            .title {
                padding: 30px;
                font-size: 30px;
                background-color: brown;
            }

            .subtitle {
                background-color: rgba(165, 42, 42, 0.75);
            }

            .pad {
                padding: 5px;
            }

            .row {
                flex-direction: row;
                display: flex;
            }

            .flex {
                flex: 1;
            }

            .center {
                text-align: center;
            }

            .pad-top {
                padding-top: 10px;
            }
        </style>
    </head>
    <body>
        <div class="title center">Pick ups</div>

        <div class="pad row" id="days"></div>

        <div id="modal_backdrop" onclick="hideModal()">
            <div id="modal_content" onclick="(e) => e.stopPropagation()""></div>
        </div>

        <script async defer src="./site_libs/google.api.js" onload="gapiLoaded()"></script>
        <script type="text/javascript">
            // Api Keys
            const API_KEY = 'AIzaSyDFuv28UyBhmAffM5ZutuJEitPteZcodlg';

            // Discovery doc URL for APIs used by the quickstart
            const DISCOVERY_DOC = 'https://sheets.googleapis.com/$discovery/rest?version=v4';

            function showModal(pickup) {
                document.getElementById("modal_backdrop").style.display = "block"
                document.getElementById("modal_content").replaceChildren(
                    div("row",
                        div("bold flex", pickup.name),
                        div("", "X").onpress(hideModal),
                    ),
                    div("pad-top p", pickup.details)
                )
            }

            function hideModal() {
                document.getElementById("modal_backdrop").style.display = "none"
            }

            function gapiLoaded() {
                gapi.load('client', async () => {
                    await gapi.client.init({
                        apiKey: API_KEY,
                        discoveryDocs: [DISCOVERY_DOC],
                    });

                    const data = await loadData();
                    build(data);
                });
            }

            function parseTime(time) {
                return time
                    .split("-")
                    .map(part => part.trim())
            }

            function formatData(data) {
                const pickups = data
                    .filter(row => row.length > 0)
                    .map((row) => ({
                        day: row[0],
                        time: parseTime(row[1]),
                        name: row[2],
                        type: row[6],
                        volunteers: [row[3], row[4], row[5]].filter((name) => name != "NEEDED" && name != ""),
                        details: row[7] || "",
                    }))

                pickups.get = ({ day }) => {
                    return pickups
                        .filter((pickup) => {
                            if (pickup.type == "shift") return false
                            if (day && pickup.day != day) return false
                            return true
                        })
                        .sort((a, b) => timeToNumber(a.time[0]) - timeToNumber(b.time[0]))
                }

                return pickups
            }

            function timeToNumber(hour) {
                if (hour == "any time") return 0
                let [hours, minutes, ampm] = hour.split(/[:\s]/);
                return Number(hours) + (Number(minutes) / 60) + (ampm === "PM" ? 12 : 0)
            }

            function getPickupUrgency(pickup) {
                if (pickup.volunteers.length == 0) {
                    return "urgent"
                }
            }

            function build(data) {
                const pickups = formatData(data)
                const root = document.getElementById("days")

                root.replaceChildren(...days.map((day) => 
                    div("pad flex",
                        div("center", day),
                        ...pickups.get({ day }).map(pickup =>
                            div(`pickup ${getPickupUrgency(pickup)}`,
                                div("bold", pickup.name),
                                div("", pickup.time.join(" - "))
                            ).onpress(() => showModal(pickup))
                        )
                    )
                ))
            }

            function div(classList, ...children) {
                const element = document.createElement("div")
                element.classList = classList
                element.replaceChildren(...children)

                element.onpress = (callback) => {
                    element.onclick = callback
                    return element
                }

                return element
            }

            let days = [
                'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday',
                // 'Saturday', 'Sunday'
            ]

            async function loadData() {
                const res = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: '1aPaHi5LJ1UB0terT4Tc0XuFE4IIYzjai6d5TM8rtWBQ',
                    range: 'A2:I',
                });
                
                return res.result.values;
            }
        </script>
    </body>
</html>
